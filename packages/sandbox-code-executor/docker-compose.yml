name: sbe

services:
  redis:
    image: redis:7-alpine
    container_name: sandbox-code-executor-redis
    ports:
      - "6379:6379"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: sandbox-code-executor-piston
    ports:
      - "2000:2000"
    volumes:
      - piston-data:/piston
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2000/api/v2/runtimes || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sandbox-code-executor:
    image: sandbox-code-executor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-code-executor
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      WORKER_POOL_SIZE: "10"
      DEFAULT_TIMEOUT: "30"
      MAX_TIMEOUT: "300"
      REDIS_URL: "redis://redis:6379"
      PISTON_URL: "http://piston:2000"
      STDOUT_MAX_SIZE: "2097152"
    depends_on:
      redis:
        condition: service_healthy
      piston:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sandbox-net

volumes:
  piston-data:

networks:
  sandbox-net:
    driver: bridge
